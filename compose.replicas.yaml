# Two identical server replicas for the 12-factor VIII/IX checks (step 13)
# and the multi-process scenarios of step 14: each replica runs HTTP and its
# own background auction loop against the shared PostgreSQL and the shared
# CSRF configuration, and gets its own published host port.
#
#   make replicas       — start db, server-1 and server-2
#   make replicas-down  — stop and remove the replicas (the database stays)
#
# No container_name and no shared host ports: the replicas are distinguished
# only by their unique published ports (REPLICA1_PORT/REPLICA2_PORT), so the
# same setup also works when the scenario is re-run or ports are remapped.
#
# The base `server` service from compose.yaml is not started by the replicas
# targets; both replica definitions share the server configuration through
# the YAML anchor below.
x-server-replica: &server-replica
  image: auction/server:local
  depends_on:
    db:
      condition: service_healthy
  environment:
    DATABASE_URL: postgres://auction:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}@db:5432/auction?sslmode=disable
    HTTP_ADDR: ":8080"
    CSRF_SECRET: ${CSRF_SECRET:?CSRF_SECRET is required (see .env.example)}
    SESSION_TTL: ${SESSION_TTL:-24h}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    METRICS_ENABLED: ${METRICS_ENABLED:-true}
    DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
    DB_TIMEOUT: ${DB_TIMEOUT:-5s}
    HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-10s}
    HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-15s}
    HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-60s}
    BID_TX_TIMEOUT: ${BID_TX_TIMEOUT:-5s}
    SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
    WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-1s}
    WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-100}
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/livez"]
    interval: 5s
    timeout: 3s
    retries: 6
    start_period: 5s
  stop_grace_period: 15s
  restart: unless-stopped

services:
  server-1:
    <<: *server-replica
    ports:
      - "127.0.0.1:${REPLICA1_PORT:-18081}:8080"

  server-2:
    <<: *server-replica
    ports:
      - "127.0.0.1:${REPLICA2_PORT:-18082}:8080"
