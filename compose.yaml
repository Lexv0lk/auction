# Local development and integration test databases.
#
#   make migrate          applies migrations/ to the db service (port 5432)
#   make test-integration applies the same SQL to db-test (port 5433) and runs
#                         the integration-tagged Go tests against it
#
# POSTGRES_PASSWORD and the host ports come from the environment or .env
# (see .env.example). Images are pinned; do not use a floating tag. The
# application itself never migrates or seeds the databases.
services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: auction
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}
      POSTGRES_DB: auction
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auction -d auction"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  migrate:
    image: migrate/migrate:v4.20.1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      [
        "-path", "/migrations/",
        "-database", "postgres://auction:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}@db:5432/auction?sslmode=disable",
        "up",
      ]

  db-test:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: auction
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}
      POSTGRES_DB: auction_test
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-5433}:5432"
    volumes:
      - db_test_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auction -d auction_test"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  migrate-test:
    image: migrate/migrate:v4.20.1
    depends_on:
      db-test:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      [
        "-path", "/migrations/",
        "-database", "postgres://auction:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}@db-test:5432/auction_test?sslmode=disable",
        "up",
      ]

volumes:
  db_data:
  db_test_data:
