version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - sqlclosecheck
    - staticcheck
    - err113
    - nlreturn
  exclusions:
    rules:
      # Integration and unit tests intentionally use fake credentials in
      # connection strings to verify that passwords never leak into diagnostics.
      - path: _test\.go
        linters:
          - gosec
        text: "G101"
      # The test helpers of every integration suite keep the testify-style
      # signature (testing.T first, request context second); the production
      # code always passes context first.
      - path: _test\.go
        linters:
          - revive
        text: "context-as-argument"

formatters:
  enable:
    - gofmt
    - goimports
